<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="{{description}}"><meta name="color-scheme" content="light dark"><link rel="icon" href="/favicon.svg"><link rel="canonical" href="{{canonical}}"><link rel="alternate" type="application/rss+xml" href="/rss.xml" title="窗边手记 RSS"><title>{{title}} · 窗边手记</title>{{styles}}<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(_){}</script></head>
<body><a class="skip-link" href="#main-content">跳到正文</a><header class="article-nav wrap"><a class="article-back" href="/">← 回到窗边手记</a><div class="article-actions"><a href="/notes/">全部手记</a><a href="/workspace/">写作间</a><button type="button" data-theme-toggle aria-label="切换深浅主题">☼</button></div></header><main id="main-content" class="article-shell wrap"><article data-public-article data-title="{{title}}" data-description="{{description}}"><div class="eyebrow">{{category}}</div><h1>{{title}}</h1><p class="article-lead">{{description}}</p><div class="article-meta"><time>{{date}}</time><span>{{readingTime}}</span><span>{{author}}</span><span>最近更新 {{updated}}</span></div>{{source}}<div class="prose">{{html}}</div><div class="tag-list">{{tags}}</div><footer class="article-end"><p>每一次理解，都值得被好好留下。</p><a class="text-link" href="/notes/">继续读一篇手记 ↗</a></footer></article><aside class="article-toc" aria-label="阅读工具"><span class="eyebrow">慢慢读</span><a class="text-link" href="/notes/">探索更多手记 ↗</a><a class="text-link" href="/workspace/">写下自己的想法 ↗</a></aside></main>{{scripts}}</body></html>
