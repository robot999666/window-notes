worker_processes 1;
pid /run/robot-blog/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 20;
    client_max_body_size 1m;
    client_body_temp_path /run/robot-blog/client_temp;
    proxy_temp_path /run/robot-blog/proxy_temp;
    fastcgi_temp_path /run/robot-blog/fastcgi_temp;
    uwsgi_temp_path /run/robot-blog/uwsgi_temp;
    scgi_temp_path /run/robot-blog/scgi_temp;
    gzip on;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/rss+xml image/svg+xml;

    server {
        listen 0.0.0.0:8088;
        listen [::]:8088 ipv6only=on;
        server_name _;
        root /opt/robot-blog/current;
        index index.html;
        charset utf-8;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # This precedes asset rules so hidden files stay inaccessible everywhere.
        location ~ (^|/)\. {
            return 404;
        }

        location = /rss.xml {
            types { }
            default_type application/rss+xml;
            try_files $uri =404;
        }

        location ~ ^/_astro/.*\.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
        }

        location ~ \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
