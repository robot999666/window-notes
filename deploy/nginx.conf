worker_processes 1;
pid /run/robot-blog/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 20;
    client_max_body_size 1m;
    client_body_temp_path /run/robot-blog/client_temp;
    proxy_temp_path /run/robot-blog/proxy_temp;
    fastcgi_temp_path /run/robot-blog/fastcgi_temp;
    uwsgi_temp_path /run/robot-blog/uwsgi_temp;
    scgi_temp_path /run/robot-blog/scgi_temp;
    gzip on;
    gzip_comp_level 3;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml application/rss+xml image/svg+xml;

    server {
        listen 0.0.0.0:8088 ssl;
        listen [::]:8088 ssl ipv6only=on;
        ssl_certificate /var/lib/robot-blog-tls/fullchain.crt;
        ssl_certificate_key /var/lib/robot-blog-tls/private.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:BlogTLS:1m;
        ssl_session_timeout 1h;
        error_page 497 =308 https://152.136.191.171:8088$request_uri;
        server_name _;
        root /opt/robot-blog/current;
        index index.html;
        charset utf-8;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;

        location /api/ {
            proxy_pass http://127.0.0.1:18088;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
        location = /notes/ { try_files /notes/index.html =404; }
        location = /notes/index.html { return 308 /notes/; }
        location ^~ /notes/ {
            proxy_pass http://127.0.0.1:18088;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
        location = /search.json { proxy_pass http://127.0.0.1:18088; }
        location = /sitemap.xml { proxy_pass http://127.0.0.1:18088; }
        location ^~ /reader/ { return 404; }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        # This precedes asset rules so hidden files stay inaccessible everywhere.
        location ~ (^|/)\. {
            return 404;
        }

        location = /rss.xml {
            proxy_pass http://127.0.0.1:18088;
        }

        location ~ ^/_astro/.*\.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
        }

        location ~ \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf|otf)$ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
            add_header X-Frame-Options SAMEORIGIN always;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
